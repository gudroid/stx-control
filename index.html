/* ---------------- licença ---------------- */
const License = {
  keys() { return Store.get('keys', []); },
  async initTrial() {
    const [a, b] = await Store.getDeep('trialStart');
    const vals = [a, b].filter(v => typeof v === 'number' && v > EPOCH);
    const start = vals.length ? Math.min(...vals) : Clock.now();
    Store.set('trialStart', start);
    const [ka, kb] = await Store.getDeep('keys');
    const all = [...new Set([...(ka || []), ...(kb || [])])];
    Store.set('keys', all);
  },
  adoptServerStart(ts) { const cur = Store.get('trialStart', Infinity); if (ts < cur) Store.set('trialStart', ts); },
  async activate(text) {
    const r = await Keys.check(text);
    if (!r.ok) return r;
    const clean = 'STX1' + b32enc(new Uint8Array([...r.key.payload, ...r.key.sig]));
    Store.set('keys', [...this.keys(), clean]);
    Telemetry.ping('active');
    return { ok: true, plan: r.key.plan, days: r.key.days };
  },
  paidUntil() {
    const revoked = (Remote.cfg && Remote.cfg.revoked) || [];
    const ks = this.keys().map(t => Keys.parse(t)).filter(k => k && !revoked.includes(k.nonce)).sort((a, b) => a.issued - b.issued);
    let exp = 0; for (const k of ks) exp = Math.max(exp, k.issued) + k.days * DAY;
    return { exp, last: ks[ks.length - 1] };
  },
  evaluate() {
    const now = Clock.now();
    const cfg = Remote.cfg || {};
    const st = { now, tampered: Clock.tampered, notices: [] };
    if (cfg.minBuild && CONFIG.BUILD < cfg.minBuild) return { ...st, state: 'update', url: cfg.updateUrl, notes: cfg.updateNotes };
    if ((cfg.blocked || []).includes(Device.id)) return { ...st, state: 'blocked', msg: cfg.blockedMsg };
    const warn = (cfg.warnings || {})[Device.id];
    if (warn && warn.blockAt && now >= warn.blockAt) return { ...st, state: 'blocked', msg: warn.message };
    if (warn) st.notices.push({ kind: 'bad', text: warn.message || 'Seu acesso será bloqueado.', until: warn.blockAt });
    if (cfg.latestBuild && CONFIG.BUILD < cfg.latestBuild) st.notices.push({ kind: 'update', text: `Nova versão ${cfg.latestVersion || ''} disponível.`, url: cfg.updateUrl });
    if (cfg.notice) st.notices.push({ kind: 'info', text: cfg.notice });
    const { exp, last } = this.paidUntil();
    if (exp > now) return this._warn({ ...st, state: 'active', until: exp, plan: last && last.plan });
    if (cfg.freeUntil && now < cfg.freeUntil) return { ...st, state: 'free', until: cfg.freeUntil };
    const trialEnd = Store.get('trialStart', now) + CONFIG.TRIAL_DAYS * DAY;
    if (trialEnd > now) return this._warn({ ...st, state: 'trial', until: trialEnd });
    return { ...st, state: exp ? 'expired' : 'trialover', until: exp || trialEnd };
  },
  _warn(st) {
    const left = st.until - st.now;
    if (left <= CONFIG.WARN_DAYS * DAY) st.notices.unshift({ kind: 'expiring', text: st.state === 'trial' ? 'Seu teste grátis está acabando.' : 'Seu aluguel está acabando.', until: st.until });
    return st;
  },
  waLink(plan) {
    const msg = `Olá! Quero alugar o *${CONFIG.APP}*.\n\n` +
      `Plano: *${plan.label}* — ${plan.price}\n` +
      `Código do aparelho: *${Device.id}*\n\n` +
      `Pode me enviar a chave de ativação? Pagamento via PIX.`;
    return `https://wa.me/${CONFIG.WHATSAPP}?text=${encodeURIComponent(msg)}`;
  },
};

function splitTime(ms) {
  ms = Math.max(0, ms);
  return { d: Math.floor(ms / DAY), h: Math.floor(ms / 3600000) % 24, m: Math.floor(ms / 60000) % 60, s: Math.floor(ms / 1000) % 60 };
}
function fmtDate(ts) { return new Date(ts).toLocaleDateString('pt-BR', { day: '2-digit', month: 'short', year: 'numeric' }); }

/* =========================================================================
   PROTOCOLO STX (player, comando 0xCA) + transportes (simulador e Bluetooth)
   Pacote de 27 bytes: [0] tipo · [1] comando · [2] tamanho · [3] ação · [4..] dados
   tipo 0 = enviar · 1 = pedir e esperar resposta · 3 = ler ajuste
   ========================================================================= */
const P = {
  CMD: 0xCA, LEN: 0x3D, SIZE: 27,
  // ações (byte 3) — ver documento de engenharia reversa
  SOURCE: 0, PLAYPAUSE: 1, PREV: 2, NEXT: 3, PREV_FOLDER: 4, NEXT_FOLDER: 5, PLAY_ID: 8,
  RADIO_IDX: 10, RADIO_FREQ: 11, MODE: 12, SEEK: 48, VOLUME_SET: 52,
  Q_SOURCE: 19, Q_STATUS: 20, Q_CUR_FOLDER: 21, Q_STATE: 24, Q_TIME: 29, Q_FILENAME: 36, Q_SONG_FOLDER: 37,
  Q_VOLUME: 51, Q_FOLDER: 53, Q_FOLDER_NAME: 15,
  SOURCES: ['USB', 'Rádio', 'Bluetooth', 'RCA', 'Desligado'],
  MODES: ['Sequencial', 'Repetir uma', 'Repetir pasta', 'Aleatório'],
  STATES: ['Pausado', 'Tocando', 'Buscando', 'Buscando', 'Alerta'],
};
const u16 = (b, i) => (b[i] & 255) | ((b[i + 1] & 255) << 8);
function latin1(b, from) { let s = ''; for (let i = from; i < b.length; i++) { if (!b[i]) break; s += String.fromCharCode(b[i]); } return s.trim(); }

class StxProtocol {
  constructor(transport) {
    this.t = transport; this.waiters = []; this.queue = []; this.busy = false; this.log = [];
    transport.onData = d => this._onData(d);
  }
  async _w(b) { try { await this.t.write(b); return true; } catch (e) { return false; } }
  packet(type, sub, data = []) {
    const b = new Uint8Array(P.SIZE);
    b[0] = type; b[1] = P.CMD; b[2] = P.LEN; b[3] = sub;
    data.forEach((v, i) => { b[4 + i] = v & 255; });
    return b;
  }
  _onData(d) {
    const b = d instanceof Uint8Array ? d : new Uint8Array(d.buffer || d);
    const i = this.waiters.findIndex(w => (w.cmd != null ? w.cmd === b[1] : (b[1] === P.CMD && w.sub === b[3])) && (!w.match || w.match(b)));
    if (i >= 0) { const w = this.waiters.splice(i, 1)[0]; clearTimeout(w.timer); w.res(b); }
    if (this.onEvent) this.onEvent(b);
  }
  // fila: o Bluetooth só aceita uma conversa por vez. priority=true fura a fila (ex.: pasta que você abriu)
  _enqueue(job, priority) {
    return new Promise((res, rej) => {
      const item = { job, res, rej };
      priority ? this.queue.unshift(item) : this.queue.push(item);
      this._pump();
    });
  }
  async _pump() {
    if (this.busy) return; this.busy = true;
    while (this.queue.length) {
      const it = this.queue.shift();
      try { it.res(await it.job()); } catch (e) { it.rej(e); }
    }
    this.busy = false;
  }
  cmd(sub, data = [], priority = true) {
    return this._enqueue(async () => { const ok = await this._w(this.packet(0, sub, data)); await sleep(25); return ok; }, priority);
  }
  request(sub, data = [], { timeout = 900, tries = 3, priority = false, match } = {}) {
    return this._enqueue(async () => {
      for (let a = 0; a < tries; a++) {
        const p = new Promise(res => {
          const w = { sub, match, res, timer: setTimeout(() => { this.waiters = this.waiters.filter(x => x !== w); res(null); }, timeout * (a + 1)) };
          this.waiters.push(w);
        });
        if (!(await this._w(this.packet(1, sub, data)))) return null;
        const r = await p;
        if (r) return r;
        await sleep(50);
      }
      return null;
    }, priority);
  }
  // ---- regulagens (DSP): mesmo pacote, outro número de comando no byte 1 ----
  dspWrite(cmd, len, b3, fill) {
    return this._enqueue(async () => {
      const b = new Uint8Array(P.SIZE); b[0] = 0; b[1] = cmd; b[2] = len; b[3] = b3 & 255; fill && fill(b);
      const ok = await this._w(b); await sleep(18); return ok;
    }, true);
  }
  dspRead(cmd, len, b3 = 0, { timeout = 700, tries = 2 } = {}) {
    return this._enqueue(async () => {
      for (let a = 0; a < tries; a++) {
        const p = new Promise(res => {
          const w = { cmd, res, timer: setTimeout(() => { this.waiters = this.waiters.filter(x => x !== w); res(null); }, timeout) };
          this.waiters.push(w);
        });
        const b = new Uint8Array(P.SIZE); b[0] = 3; b[1] = cmd; b[2] = len; b[3] = b3 & 255;
        if (!(await this._w(b))) return null;
        const r = await p; if (r) return r;
      }
      return null;
    }, false);
  }
  // ---- leituras com significado ----
  async status() {
    const r = await this.request(P.Q_STATUS, [], { priority: true }); if (!r) return null;
    return { mode: r[5], connected: !!r[6], songs: u16(r, 7), folders: u16(r, 9) };
  }
  async folder(id, priority = false) {
    const r = await this.request(P.Q_FOLDER, [id & 255, id >> 8], { priority, match: b => u16(b, 4) === id }); if (!r) return null;
    return { id: u16(r, 4), first: u16(r, 6), count: u16(r, 8), name: latin1(r, 10) };
  }
  async fileName(idx, priority = false) {
    const r = await this.request(P.Q_FILENAME, [idx & 255, idx >> 8], { priority, match: b => u16(b, 4) === idx }); if (!r) return null;
    return latin1(r, 6);
  }
  async time() { const r = await this.request(P.Q_TIME, [], { timeout: 600, tries: 1, priority: true }); return r && { cur: u16(r, 4), total: u16(r, 8) }; }
  async state() { const r = await this.request(P.Q_STATE, [], { timeout: 600, tries: 1, priority: true }); return r ? r[4] : null; }
  async folderName() { const r = await this.request(P.Q_FOLDER_NAME, [], { timeout: 600, tries: 1, priority: true }); return r ? latin1(r, 6) : null; }
  async source() { const r = await this.request(P.Q_SOURCE, [], { priority: true }); return r ? r[4] : null; }
  async volume() { const r = await this.request(P.Q_VOLUME, [], { priority: true }); return r ? r[4] : null; }
}

/* ---------------- simulador (modo demonstração) ----------------
   Responde exatamente no formato do protocolo, para o app funcionar igual quando o Bluetooth for ligado. */
const DEMO_LIB = [
  ['FORRÓ', 0], ['Trio Mandacaru', 14], ['Banda Brisa do Sertão', 16], ['Forró Pé de Serra 2026', 12], ['Os Cabras do Agreste', 10],
  ['PAGODE', 0], ['Grupo Roda Leve', 13], ['Pagode do Quintal', 11], ['Samba de Raiz Vol 3', 9],
  ['PISEIRO - Zé do Paredão', 15], ['PISEIRO - Vaqueiro Elétrico', 12],
  ['SERTANEJO_Dupla Rio Verde', 14], ['SERTANEJO_Léo e Raul', 12],
  ['Arrocha das Antigas', 16], ['Funk Paredão 2026', 18], ['Eletrônica Automotivo', 20],
  ['BREGA', 0], ['Brega Romântico', 10], ['Bregadeira Top', 9],
  ['Flashback 80 e 90', 15], ['Melody Pará', 10], ['Reggae do Maranhão', 12],
  ['Gravações ao vivo', 8], ['Vinhetas DJ guucds', 6],
];
const W1 = ['Coração', 'Noite', 'Saudade', 'Paixão', 'Estrada', 'Luar', 'Batida', 'Paredão', 'Vaquejada', 'Amor', 'Sertão', 'Chuva', 'Fogo', 'Sereia', 'Balanço', 'Madrugada'];
const W2 = ['de Vaqueiro', 'no Sertão', 'Sem Fim', 'Proibida', 'de Verão', 'do Interior', 'na Praia', 'Bandida', 'Elétrica', 'de Novo', 'Dourada', 'em Chamas', 'da Cidade', 'Maluca', 'Sincera', 'no Paredão'];

class SimTransport {
  constructor() {
    this.name = 'Modo demonstração'; this.failRate = 0.18;
    this.folders = []; this.songs = [];
    let idx = 0;
    DEMO_LIB.forEach(([name, count], id) => {
      this.folders.push({ id, name, first: idx, count });
      for (let i = 0; i < count; i++) {
        const hsh = hashStr(name + i);
        const t = `${pad(i + 1)} - ${W1[hsh % W1.length]} ${W2[(hsh >>> 5) % W2.length]}.mp3`;
        this.songs.push({ name: t, folder: id, dur: 150 + (hsh % 130) });
      }
      idx += count;
    });
    this.s = { source: 0, playing: false, idx: 0, pos: 0, mode: 0, vol: 22 };
    setInterval(() => this._tick(), 1000);
  }
  async connect() { return true; }
  _cur() { return this.songs[this.s.idx]; }
  _tick() {
    if (!this.s.playing || this.s.source !== 0) return;
    this.s.pos++;
    if (this.s.pos >= this._cur().dur) this._auto();
  }
  _auto() {
    const s = this.s, f = this.folders[this._cur().folder];
    if (s.mode === 1) s.pos = 0;
    else if (s.mode === 3) { s.idx = (Math.random() * this.songs.length) | 0; s.pos = 0; }
    else if (s.mode === 2) { s.idx = s.idx + 1 < f.first + f.count ? s.idx + 1 : f.first; s.pos = 0; }
    else { s.idx = (s.idx + 1) % this.songs.length; s.pos = 0; }
  }
  _folderJump(dir) {
    const cur = this._cur().folder; let i = cur;
    for (let k = 0; k < this.folders.length; k++) {
      i = (i + dir + this.folders.length) % this.folders.length;
      if (this.folders[i].count) { this.s.idx = this.folders[i].first; this.s.pos = 0; return; }
    }
  }
  _reply(sub, fill) {
    const b = new Uint8Array(64); b[0] = 1; b[1] = P.CMD; b[2] = P.LEN; b[3] = sub; fill(b);
    setTimeout(() => this.onData && this.onData(b), 18 + Math.random() * 40);
  }
  _str(b, at, s) { for (let i = 0; i < s.length && at + i < b.length - 1; i++) { const c = s.charCodeAt(i); b[at + i] = c < 256 ? c : 63; } }
  async write(pkt) {
    await sleep(6);
    if (pkt[1] !== P.CMD) { // regulagens
      this.dsp = this.dsp || new Map();
      if (pkt[0] === 0) { this.dsp.set(pkt[1], new Uint8Array(pkt)); this.lastDsp = pkt[1]; return; }
      const saved = this.dsp.get(pkt[1]);
      if (saved) { const b = new Uint8Array(saved); b[0] = 3; setTimeout(() => this.onData && this.onData(b), 12 + Math.random() * 25); }
      return;
    }
    const type = pkt[0], sub = pkt[3], s = this.s, d = pkt.slice(4);
    const id = d[0] | (d[1] << 8);
    if (type === 0) {
      switch (sub) {
        case P.SOURCE: s.source = d[0]; break;
        case P.PLAYPAUSE: s.playing = !s.playing; break;
        case P.NEXT: s.idx = (s.idx + 1) % this.songs.length; s.pos = 0; s.playing = true; break;
        case P.PREV: s.idx = (s.idx - 1 + this.songs.length) % this.songs.length; s.pos = 0; s.playing = true; break;
        case P.NEXT_FOLDER: this._folderJump(1); s.playing = true; break;
        case P.PREV_FOLDER: this._folderJump(-1); s.playing = true; break;
        case P.PLAY_ID:
          if (Math.random() < this.failRate) return; // às vezes o aparelho ignora (simula o problema real)
          if (id < this.songs.length) { s.idx = id; s.pos = 0; s.playing = true; s.source = 0; } break;
        case P.MODE: s.mode = d[0] & 3; break;
        case P.SEEK: s.pos = Math.floor(this._cur().dur * Math.min(100, d[0]) / 100); break;
        case P.VOLUME_SET: s.vol = d[0]; break;
      }
      return;
    }
    switch (sub) {
      case P.Q_STATUS: return this._reply(sub, b => { b[5] = s.mode; b[6] = 1; b[7] = this.songs.length & 255; b[8] = this.songs.length >> 8; b[9] = this.folders.length & 255; b[10] = this.folders.length >> 8; });
      case P.Q_FOLDER: { const f = this.folders[id]; if (!f) return; return this._reply(sub, b => { b[4] = id & 255; b[5] = id >> 8; b[6] = f.first & 255; b[7] = f.first >> 8; b[8] = f.count & 255; b[9] = f.count >> 8; this._str(b, 10, f.name); }); }
      case P.Q_FILENAME: { const t = this.songs[id]; if (!t) return; return this._reply(sub, b => { b[4] = id & 255; b[5] = id >> 8; this._str(b, 6, t.name); }); }
      case P.Q_SONG_FOLDER: { const t = this.songs[id]; if (!t) return; return this._reply(sub, b => { b[4] = id & 255; b[5] = id >> 8; this._str(b, 6, this.folders[t.folder].name); }); }
      case P.Q_TIME: return this._reply(sub, b => { const c = this._cur(); b[4] = s.pos & 255; b[5] = s.pos >> 8; b[8] = c.dur & 255; b[9] = c.dur >> 8; });
      case P.Q_STATE: return this._reply(sub, b => { b[4] = s.playing ? 1 : 0; });
      case P.Q_FOLDER_NAME: return this._reply(sub, b => this._str(b, 6, this.folders[this._cur().folder].name));
      case P.Q_CUR_FOLDER: return this._reply(sub, b => { const f = this._cur().folder; b[6] = f & 255; b[7] = f >> 8; });
      case P.Q_SOURCE: return this._reply(sub, b => { b[4] = s.source; });
      case P.Q_VOLUME: return this._reply(sub, b => { b[4] = s.vol; });
    }
  }
  // usado só pela tela, para mostrar a faixa atual no modo demonstração
  peekIndex() { return this.s.idx; }
}

/* ---------------- registro da conexão (para diagnóstico) ---------------- */
const ConnLog = {
  lines: [], max: 400,
  hex: b => Array.from(b, x => x.toString(16).padStart(2, '0')).join(' ').toUpperCase(),
  add(dir, bytes, note) {
    const d = new Date(); const t = `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}.${String(d.getMilliseconds()).padStart(3, '0')}`;
    const arrow = dir === 'tx' ? '→' : dir === 'rx' ? '←' : dir === 'err' ? '✖' : '•';
    this.lines.push(`${t} ${arrow} ${bytes ? this.hex(bytes) + (bytes.length ? ` (${bytes.length})` : '') : ''}${note ? (bytes ? '  ' : '') + note : ''}`);
    if (this.lines.length > this.max) this.lines.splice(0, this.lines.length - this.max);
    if (this.onChange) this.onChange();
  },
  text() { return this.lines.join('\n'); },
};

/* ---------------- Bluetooth de verdade (Web Bluetooth, Chrome) ---------------- */
const BLE = {
  SVC: '00000427-0000-1000-8000-00805f9b34fb', TX: '00000429-0000-1000-8000-00805f9b34fb', RX: '00000428-0000-1000-8000-00805f9b34fb',
  ALT: '0000ff12-0000-1000-8000-00805f9b34fb', OAD: 'f000ffc0-0451-4000-b000-000000000000',
};
class BleTransport {
  constructor() { this.name = 'Bluetooth'; this.connected = false; this.manual = false; }
  static available() { return !!(navigator.bluetooth && navigator.bluetooth.requestDevice); }
  status(s, info) { this.state = s; if (this.onStatus) this.onStatus(s, info); }
  async connect() {
    ConnLog.add('i', null, 'Procurando processador…');
    this.dev = await navigator.bluetooth.requestDevice({
      filters: [{ services: [BLE.SVC] }, { namePrefix: 'STX' }, { namePrefix: 'LDX' }, { namePrefix: 'DSP' }, { namePrefix: 'Stetsom' }],
      optionalServices: [BLE.SVC, BLE.ALT, BLE.OAD],
    });
    this.name = this.dev.name || 'Processador STX';
    ConnLog.add('i', null, `Escolhido: ${this.name}`);
    this.dev.addEventListener('gattserverdisconnected', () => this._lost());
    await this._open();
    return true;
  }
  async _open() {
    this.status('connecting');
    const gatt = await this.dev.gatt.connect();
    ConnLog.add('i', null, 'Conectado. Lendo serviços…');
    let svc;
    try { svc = await gatt.getPrimaryService(BLE.SVC); }
    catch (e) {
      try { const all = await gatt.getPrimaryServices(); ConnLog.add('err', null, 'Serviço 0427 não encontrado. Serviços do aparelho: ' + all.map(x => x.uuid).join(', ')); } catch {}
      throw new Error('Este aparelho não tem o serviço do STX (0427). Veja o registro da conexão.');
    }
    const chars = await svc.getCharacteristics();
    chars.forEach(c => { const p = c.properties; ConnLog.add('i', null, `Canal ${c.uuid.slice(4, 8)}: ${['read', 'write', 'writeWithoutResponse', 'notify', 'indicate'].filter(k => p[k]).join(', ')}`); });
    this.tx = chars.find(c => c.uuid === BLE.TX) || chars.find(c => c.properties.write || c.properties.writeWithoutResponse);
    this.rx = chars.find(c => c.uuid === BLE.RX) || chars.find(c => c.properties.notify || c.properties.indicate);
    if (!this.tx || !this.rx) throw new Error('Não achei os canais de envio/recebimento. Veja o registro da conexão.');
    if (!this._bound) {
      this._bound = e => { const v = e.target.value; const b = new Uint8Array(v.buffer, v.byteOffset, v.byteLength).slice(); ConnLog.add('rx', b); this.onData && this.onData(b); };
    }
    this.rx.removeEventListener('characteristicvaluechanged', this._bound);
    this.rx.addEventListener('characteristicvaluechanged', this._bound);
    await this.rx.startNotifications();
    ConnLog.add('i', null, `Pronto. Envio pelo ${this.tx.uuid.slice(4, 8)}, respostas pelo ${this.rx.uuid.slice(4, 8)}.`);
    this.connected = true; this.status('connected');
  }
  async write(pkt) {
    if (!this.connected) throw new Error('Processador desconectado');
    ConnLog.add('tx', pkt);
    const p = this.tx.properties;
    try {
      // o app oficial usa escrita com confirmação; aceita pacotes maiores que 20 bytes
      if (p.write && this.tx.writeValueWithResponse) await this.tx.writeValueWithResponse(pkt);
      else if (this.tx.writeValueWithoutResponse) await this.tx.writeValueWithoutResponse(pkt);
      else await this.tx.writeValue(pkt);
    } catch (e) {
      ConnLog.add('err', null, 'Falha ao enviar: ' + e.message);
      if (p.writeWithoutResponse && this.tx.writeValueWithoutResponse && !/disconnect/i.test(e.message)) { await sleep(40); await this.tx.writeValueWithoutResponse(pkt); }
      else throw e;
    }
  }
  async _lost() {
    this.connected = false;
    ConnLog.add('err', null, 'Conexão perdida.');
    if (this.manual) { this.status('off'); return; }
    this.status('reconnecting');
    for (let i = 1; i <= 5 && !this.manual; i++) {
      await sleep(800 * i);
      try { ConnLog.add('i', null, `Reconectando (tentativa ${i})…`); await this._open(); if (this.onReconnect) this.onReconnect(); return; }
      catch (e) { ConnLog.add('err', null, e.message); }
    }
    this.status('off');
  }
  disconnect() { this.manual = true; try { this.dev && this.dev.gatt.disconnect(); } catch {} this.connected = false; this.status('off'); }
}

/* =========================================================================
   REGULAGENS DO PROCESSADOR (STX2496BT / Nano, 8 saídas)
   Codificação tirada do app oficial (classes bf0, cu0, qb8, yg4, c85, ud4, bh0, sd4, o00, xf4, km2)
   ========================================================================= */
const D = {
  GEQ: 0x00, PEQ_IN: 0x02, PEQ_OUT: 0x25, XO: 0x5D, LIM: 0x65, ROUTER: 0x6D, LEVEL: 0x6E, INLEVEL: 0x6F,
  DELAY: 0x70, PHASE: 0x71, FREQ: 0x72, NOISE: 0x74, SUB: 0x75, SEQ: 0x7D, DIMMER: 0xD3,
  LEN: { GEQ: 17, PEQ: 5, XO: 8, LIM: 16, ROUTER: 9, LEVEL: 20, INLEVEL: 12, DELAY: 18, PHASE: 2, FREQ: 6, NOISE: 4, SUB: 4, SEQ: 4, DIMMER: 2 },
  OUTS: 8, BANDS: 7,
  GEQ_F: [25, 40, 63, 100, 160, 250, 400, 630, 1000, 1600, 2500, 4000, 6300, 10000, 16000],
  COLORS: ['#ff5a36', '#ff8a3d', '#ffb23f', '#e6d24a', '#3ddc97', '#3ec6e0', '#6f8bff', '#c47bff'],
  SOURCES: [['inA', 'A'], ['inB', 'B'], ['inC', 'C'], ['inD', 'D'], ['mpL', 'Player E'], ['mpR', 'Player D']],
  PEQ_TYPES: ['Sino', 'Prateleira grave', 'Prateleira aguda'],
};
// 28 filtros do crossover do STX2496BT (enum bx0): 0 desligado, Butterworth, Linkwitz-Riley e Bessel de 12 a 60 dB/oit
D.XO_TYPES = [{ n: 'Desligado', fam: 'off', s: 0 }];
for (const [fam, nome] of [['bt', 'Butterworth'], ['lr', 'Linkwitz-Riley'], ['bs', 'Bessel']])
  for (const s of [12, 18, 24, 30, 36, 42, 48, 54, 60]) D.XO_TYPES.push({ n: `${nome} ${s} dB`, fam, s });
const XT = (fam, s) => D.XO_TYPES.findIndex(t => t.fam === fam && t.s === s);
// presets de crossover do app oficial (pv0.d) — índice = byte de preset
D.XO_PRESETS = [
  { n: 'Faixa inteira', hp: [10, 0], lp: [22000, 0] },
  { n: 'Subwoofer 50–150 Hz', hp: [50, XT('bt', 12)], lp: [150, XT('lr', 24)] },
  { n: 'Subwoofer até 80 Hz', hp: [10, 0], lp: [80, XT('lr', 24)] },
  { n: 'Subwoofer 30–90 Hz', hp: [30, XT('bt', 12)], lp: [90, XT('lr', 24)] },
  { n: 'Médio-grave 100 Hz–1 kHz', hp: [100, XT('lr', 24)], lp: [1000, XT('lr', 24)] },
  { n: 'Woofer 60 Hz–1 kHz', hp: [60, XT('bt', 12)], lp: [1000, XT('lr', 24)] },
  { n: 'Woofer 45–800 Hz', hp: [45, XT('bt', 12)], lp: [800, XT('lr', 24)] },
  { n: 'Médio 700 Hz–7 kHz', hp: [700, XT('lr', 24)], lp: [7000, XT('lr', 24)] },
  { n: 'Médio 1–7 kHz', hp: [1000, XT('lr', 24)], lp: [7000, XT('lr', 24)] },
  { n: 'Tweeter acima de 1,65 kHz', hp: [1650, XT('lr', 24)], lp: [22000, 0] },
  { n: 'Super tweeter acima de 7 kHz', hp: [7000, XT('lr', 24)], lp: [22000, 0] },
  { n: 'Faixa inteira (2)', hp: [10, 0], lp: [22000, 0] },
];

const i16 = (b, i, v) => { v = Math.round(v) & 0xFFFF; b[i] = v & 255; b[i + 1] = v >> 8; };
const r16 = (b, i) => { const v = (b[i] & 255) | ((b[i + 1] & 255) << 8); return v > 32767 ? v - 65536 : v; };
const s8 = v => (v > 127 ? v - 256 : v);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));

function defaultOut(i) {
  const names = ['Sub 1', 'Sub 2', 'Médio-grave E', 'Médio-grave D', 'Médio E', 'Médio D', 'Tweeter E', 'Tweeter D'];
  const pr = [2, 2, 5, 5, 7, 7, 9, 9][i]; const x = D.XO_PRESETS[pr];
  return {
    name: names[i], level: 0, on: true, phase: false, delay: 0,
    xo: { preset: pr, hpF: x.hp[0], hpT: x.hp[1], lpF: x.lp[0], lpT: x.lp[1] },
    peq: [63, 160, 400, 1000, 2500, 6300, 12000].map(f => ({ type: 0, f, g: 0, q: 1.4, on: true })),
    lim: { rmsOn: false, rmsAuto: false, rmsThr: -6, att: 5, rmsHold: 50, rmsRel: 300, peakOn: false, peakAuto: false, peakThr: -3, peakHold: 10, peakRel: 100 },
    route: { inA: i % 2 === 0, inB: i % 2 === 1, inC: false, inD: false, mpL: i % 2 === 0, mpR: i % 2 === 1, type: 0 },
    sub: { on: false, freq: 45, gain: 0 },
    dist: 0,
  };
}
function defaultState() {
  return {
    model: 'STX2496BT', masterOn: true, main: 30,
    outs: Array.from({ length: D.OUTS }, (_, i) => defaultOut(i)),
    geq: { preset: 12, g: D.GEQ_F.map(() => 0) },
    inPeq: [63, 160, 400, 1000, 2500, 6300, 12000].map(f => ({ type: 0, f, g: 0, q: 1.4, on: true })),
    inLevel: { lv: [0, 0, 0, 0, 0], on: [true, true, true, true, true] },
    freq: { on: false, f: 50, g: 0 },
    noise: { on: false, g: -20 },
    seq: { outs: [true, true, true], on: 1, off: 1 },
    dimmer: { on: true, v: 80 },
  };
}

/* ---------- codificação de cada comando ---------- */
const Enc = {
  level: (s, idx = 0) => [D.LEVEL, D.LEN.LEVEL, idx, b => { b[4] = s.masterOn ? 1 : 0; b[5] = s.main; let m = 0; s.outs.forEach((o, i) => { if (o.on) m |= 1 << i; }); b[6] = m; s.outs.forEach((o, i) => i16(b, 7 + i * 2, o.level * 10)); }],
  xo: (s, ch) => [D.XO + ch, D.LEN.XO, ch, b => { const x = s.outs[ch].xo; b[4] = x.preset; i16(b, 5, x.hpF); b[7] = x.hpT; i16(b, 8, x.lpF); b[10] = x.lpT; }],
  delay: s => [D.DELAY, D.LEN.DELAY, 0, b => { b[4] = 1; s.outs.forEach((o, i) => i16(b, 5 + i * 2, o.delay * 10)); }],
  geq: s => [D.GEQ, D.LEN.GEQ, 0, b => { b[4] = s.geq.preset; s.geq.g.forEach((g, i) => { b[5 + i] = Math.round(g * 10) & 255; }); }],
  peqBand: (p, cmd, idx) => [cmd, D.LEN.PEQ, 0, b => { b[3] = ((p.type ? 1 : 0) << 4) | ((p.type === 2 ? 1 : 0) << 5) | ((p.on ? 1 : 0) << 6); i16(b, 4, p.f); b[6] = Math.round(p.g * 10) & 255; b[7] = Math.round(p.q * 10) & 255; }],
  peqOut: (s, ch, band) => Enc.peqBand(s.outs[ch].peq[band], D.PEQ_OUT + ch * D.BANDS + band),
  peqIn: (s, band) => Enc.peqBand(s.inPeq[band], D.PEQ_IN + band),
  lim: (s, ch) => [D.LIM + ch, D.LEN.LIM, ch, b => { const l = s.outs[ch].lim;
    b[4] = (l.rmsAuto ? 1 : 0) | (l.rmsOn ? 2 : 0) | (l.peakAuto ? 4 : 0) | (l.peakOn ? 8 : 0);
    i16(b, 5, l.rmsThr * 10); i16(b, 7, l.att * 10); i16(b, 9, l.rmsHold); i16(b, 11, l.rmsRel); i16(b, 13, l.peakThr * 10); i16(b, 15, l.peakHold); i16(b, 17, l.peakRel); }],
  router: s => [D.ROUTER, D.LEN.ROUTER, 0, b => { s.outs.forEach((o, i) => { const r = o.route; b[4 + i] = (r.mpL ? 1 : 0) | (r.mpR ? 2 : 0) | (r.inA ? 4 : 0) | (r.inB ? 8 : 0) | (r.inC ? 16 : 0) | (r.inD ? 32 : 0) | (r.type ? 64 : 0); }); }],
  phase: s => [D.PHASE, D.LEN.PHASE, 0, b => { let m = 0; s.outs.forEach((o, i) => { if (o.phase) m |= 1 << i; }); b[4] = m; }],
  inLevel: (s, field = 2) => [D.INLEVEL, D.LEN.INLEVEL, field, b => { let m = 0; s.inLevel.on.forEach((v, i) => { if (v) m |= 1 << i; }); b[4] = m; for (let i = 0; i < 4; i++) i16(b, 5 + i * 2, s.inLevel.lv[i] * 10); i16(b, 13, s.inLevel.lv[4]); }],
  freq: s => [D.FREQ, D.LEN.FREQ, 0, b => { b[4] = s.freq.on ? 1 : 0; i16(b, 5, s.freq.g * 10); i16(b, 7, s.freq.f); }],
  noise: s => [D.NOISE, D.LEN.NOISE, 0, b => { b[4] = s.noise.on ? 1 : 0; i16(b, 5, s.noise.g * 10); }],
  sub: (s, ch, field = 1) => [D.SUB + ch, D.LEN.SUB, field, b => { const x = s.outs[ch].sub; b[4] = x.on ? 1 : 0; b[5] = x.freq; b[6] = Math.round(x.gain * 10); }],
  seq: s => [D.SEQ, D.LEN.SEQ, 0, b => { b[4] = s.seq.outs.reduce((m, v, i) => m | (v ? 1 << i : 0), 0); b[5] = Math.round(s.seq.on * 2); b[6] = Math.round(s.seq.off * 2); }],
  dimmer: s => [D.DIMMER, D.LEN.DIMMER, s.dimmer.v, b => { b[3] = s.dimmer.v; b[4] = s.dimmer.on ? 1 : 0; }],
};
/* ---------- leitura (mesmo formato, ao contrário) ---------- */
const Dec = {
  level(s, b) { s.masterOn = !!b[4]; s.main = b[5]; s.outs.forEach((o, i) => { o.on = !!(b[6] & (1 << i)); o.level = r16(b, 7 + i * 2) / 10; }); },
  xo(s, ch, b) { const x = s.outs[ch].xo; x.preset = b[4]; x.hpF = r16(b, 5); x.hpT = b[7]; x.lpF = r16(b, 8); x.lpT = b[10]; },
  delay(s, b) { s.outs.forEach((o, i) => { o.delay = r16(b, 5 + i * 2) / 10; }); },
  geq(s, b) { s.geq.preset = b[4]; s.geq.g = D.GEQ_F.map((_, i) => s8(b[5 + i]) / 10); },
  peqBand(p, b) { p.type = (b[3] & 32) ? 2 : (b[3] & 16) ? 1 : 0; p.on = !!(b[3] & 64); p.f = r16(b, 4); p.g = s8(b[6]) / 10; p.q = b[7] / 10; },
  lim(s, ch, b) { const l = s.outs[ch].lim; l.rmsAuto = !!(b[4] & 1); l.rmsOn = !!(b[4] & 2); l.peakAuto = !!(b[4] & 4); l.peakOn = !!(b[4] & 8);
    l.rmsThr = r16(b, 5) / 10; l.att = r16(b, 7) / 10; l.rmsHold = r16(b, 9); l.rmsRel = r16(b, 11); l.peakThr = r16(b, 13) / 10; l.peakHold = r16(b, 15); l.peakRel = r16(b, 17); },
  router(s, b) { s.outs.forEach((o, i) => { const v = b[4 + i]; Object.assign(o.route, { mpL: !!(v & 1), mpR: !!(v & 2), inA: !!(v & 4), inB: !!(v & 8), inC: !!(v & 16), inD: !!(v & 32), type: (v >> 6) & 1 }); }); },
  phase(s, b) { s.outs.forEach((o, i) => { o.phase = !!(b[4] & (1 << i)); }); },
  inLevel(s, b) { s.inLevel.on = [0, 1, 2, 3, 4].map(i => !!(b[4] & (1 << i))); for (let i = 0; i < 4; i++) s.inLevel.lv[i] = r16(b, 5 + i * 2) / 10; s.inLevel.lv[4] = r16(b, 13); },
  freq(s, b) { s.freq.on = !!b[4]; s.freq.g = r16(b, 5) / 10; s.freq.f = r16(b, 7); },
  noise(s, b) { s.noise.on = !!b[4]; s.noise.g = r16(b, 5) / 10; },
  sub(s, ch, b) { const x = s.outs[ch].sub; x.on = !!b[4]; x.freq = b[5]; x.gain = b[6] / 10; },
};

/* =========================================================================
   Estado, envio com espera curta (não engasga o Bluetooth), presets
   ========================================================================= */
const Dsp = {
  s: null, proto: null, _timers: new Map(), sending: 0, listeners: new Set(), readProgress: null,
  init(proto) {
    this.proto = proto;
    const saved = Store.get('dsp', null);
    this.s = saved && saved.outs && saved.outs.length === D.OUTS ? Object.assign(defaultState(), saved) : defaultState();
  },
  on(fn) { this.listeners.add(fn); return () => this.listeners.delete(fn); },
  emit(w) { this.listeners.forEach(fn => { try { fn(w); } catch (e) { console.error(e); } }); },
  save() { clearTimeout(this._sv); this._sv = setTimeout(() => Store.set('dsp', this.s), 250); },
  // agenda o envio de um comando; mudanças rápidas (arrastar o fader) viram um envio só
  push(key, encFn, wait = 70) {
    this.save();
    clearTimeout(this._timers.get(key));
    this._timers.set(key, setTimeout(async () => {
      this._timers.delete(key);
      const [cmd, len, b3, fill] = encFn();
      this.sending++; this.emit('send');
      try { await this.proto.dspWrite(cmd, len, b3, fill); } finally { this.sending--; this.emit('send'); }
    }, wait));
  },
  send: {
    level: idx => Dsp.push('level', () => Enc.level(Dsp.s, idx)),
    xo: ch => Dsp.push('xo' + ch, () => Enc.xo(Dsp.s, ch)),
    delay: () => Dsp.push('delay', () => Enc.delay(Dsp.s)),
    geq: () => Dsp.push('geq', () => Enc.geq(Dsp.s)),
    peqOut: (ch, b) => Dsp.push(`peq${ch}.${b}`, () => Enc.peqOut(Dsp.s, ch, b)),
    peqIn: b => Dsp.push('peqin' + b, () => Enc.peqIn(Dsp.s, b)),
    lim: ch => Dsp.push('lim' + ch, () => Enc.lim(Dsp.s, ch)),
    router: () => Dsp.push('router', () => Enc.router(Dsp.s)),
    phase: () => Dsp.push('phase', () => Enc.phase(Dsp.s)),
    inLevel: () => Dsp.push('inlevel', () => Enc.inLevel(Dsp.s)),
    freq: () => Dsp.push('freq', () => Enc.freq(Dsp.s)),
    noise: () => Dsp.push('noise', () => Enc.noise(Dsp.s)),
    sub: ch => Dsp.push('sub' + ch, () => Enc.sub(Dsp.s, ch)),
    seq: () => Dsp.push('seq', () => Enc.seq(Dsp.s)),
    dimmer: () => Dsp.push('dimmer', () => Enc.dimmer(Dsp.s)),
  },
  allCommands() {
    const s = this.s, list = [Enc.level(s), Enc.delay(s), Enc.phase(s), Enc.router(s), Enc.geq(s), Enc.inLevel(s), Enc.freq(s), Enc.seq(s), Enc.dimmer(s)];
    for (let ch = 0; ch < D.OUTS; ch++) { list.push(Enc.xo(s, ch), Enc.lim(s, ch), Enc.sub(s, ch)); for (let b = 0; b < D.BANDS; b++) list.push(Enc.peqOut(s, ch, b)); }
    for (let b = 0; b < D.BANDS; b++) list.push(Enc.peqIn(s, b));
    return list;
  },
  async sendAll(onProgress) {
    const list = this.allCommands();
    for (let i = 0; i < list.length; i++) { const [c, l, b3, f] = list[i]; await this.proto.dspWrite(c, l, b3, f); if (onProgress) onProgress(i + 1, list.length); }
    this.save(); this.emit('all');
  },
  // coloca o estado atual no simulador sem passar pela fila (modo demonstração)
  seedSim(tr) { if (!tr || tr.failRate == null) return; tr.dsp = tr.dsp || new Map(); for (const [c, l, b3, f] of this.allCommands()) { const b = new Uint8Array(P.SIZE); b[1] = c; b[2] = l; b[3] = b3; f(b); tr.dsp.set(c, b); } },
  async readAll(onProgress) {
    const s = JSON.parse(JSON.stringify(this.s)); const jobs = [];
    const add = (enc, dec) => jobs.push({ enc, dec });
    add(Enc.level(s), b => Dec.level(s, b)); add(Enc.delay(s), b => Dec.delay(s, b)); add(Enc.phase(s), b => Dec.phase(s, b));
    add(Enc.router(s), b => Dec.router(s, b)); add(Enc.geq(s), b => Dec.geq(s, b)); add(Enc.inLevel(s), b => Dec.inLevel(s, b));
    add(Enc.freq(s), b => Dec.freq(s, b)); add(Enc.noise(s), b => Dec.noise(s, b));
    for (let ch = 0; ch < D.OUTS; ch++) {
      add(Enc.xo(s, ch), b => Dec.xo(s, ch, b)); add(Enc.lim(s, ch), b => Dec.lim(s, ch, b)); add(Enc.sub(s, ch), b => Dec.sub(s, ch, b));
      for (let k = 0; k < D.BANDS; k++) add(Enc.peqOut(s, ch, k), b => Dec.peqBand(s.outs[ch].peq[k], b));
    }
    for (let k = 0; k < D.BANDS; k++) add(Enc.peqIn(s, k), b => Dec.peqBand(s.inPeq[k], b));
    let ok = 0;
    for (let i = 0; i < jobs.length; i++) {
      const [cmd, len, b3] = jobs[i].enc;
      const r = await this.proto.dspRead(cmd, len, b3);
      if (r) { jobs[i].dec(r); ok++; }
      if (onProgress) onProgress(i + 1, jobs.length);
    }
    if (ok) { this.s = s; this.save(); this.emit('all'); }
    return { ok, total: jobs.length };
  },
  // ---- presets salvos no tablet ----
  presets() { return Store.get('dspPresets', []); },
  savePreset(name) { const list = this.presets(); list.unshift({ id: Date.now().toString(36), name, at: Date.now(), s: JSON.parse(JSON.stringify(this.s)) }); Store.set('dspPresets', list.slice(0, 60)); },
  deletePreset(id) { Store.set('dspPresets', this.presets().filter(p => p.id !== id)); },
  async loadPreset(st, onProgress) { this.s = Object.assign(defaultState(), JSON.parse(JSON.stringify(st))); this.emit('all'); await this.sendAll(onProgress); },
  role(o) {
    const x = o.xo, hp = x.hpT ? x.hpF : 0, lp = x.lpT ? x.lpF : 99999;
    if (lp <= 250) return 'sub';
    if (hp >= 1200) return 'tweeter';
    if (hp >= 250 || (lp <= 9000 && hp >= 150)) return 'medio';
    if (lp <= 3000) return 'grave';
    return 'full';
  },
};
const ROLE_NAMES = { sub: 'Sub', grave: 'Grave', medio: 'Médio', tweeter: 'Tweeter', full: 'Faixa toda' };

/* =========================================================================
   Matemática da curva de resposta (para os gráficos)
   ========================================================================= */
const Resp = {
  FS: 48000,
  xo(f, hpF, hpT, lpF, lpT) {
    let db = 0;
    const part = (ratio, t) => {
      const T = D.XO_TYPES[t]; if (!T || T.fam === 'off') return 0;
      const n = T.s / 6;
      if (T.fam === 'lr') return -10 * Math.log10(Math.pow(1 + Math.pow(ratio, n), 2) / 1) / 1 + 0; // LR = Butterworth ao quadrado
      if (T.fam === 'bs') { const r = ratio * 1.25; return -10 * Math.log10(1 + Math.pow(r, 2 * n) * .7 + Math.pow(r, 2) * .3 * Math.min(1, n / 2)); }
      return -10 * Math.log10(1 + Math.pow(ratio, 2 * n));
    };
    db += part(hpF / f, hpT);
    db += part(f / lpF, lpT);
    return db;
  },
  biquad(type, f0, g, q, f) {
    if (!g && type === 0) return 0;
    const A = Math.pow(10, g / 40), w0 = 2 * Math.PI * f0 / this.FS, al = Math.sin(w0) / (2 * Math.max(.1, q)), cw = Math.cos(w0);
    let b0, b1, b2, a0, a1, a2;
    if (type === 1 || type === 2) {
      const sA = 2 * Math.sqrt(A) * al, s = type === 1 ? -1 : 1;
      b0 = A * ((A + 1) - s * (A - 1) * cw + sA); b1 = 2 * s * A * ((A - 1) - s * (A + 1) * cw); b2 = A * ((A + 1) - s * (A - 1) * cw - sA);
      a0 = (A + 1) + s * (A - 1) * cw + sA; a1 = -2 * s * ((A - 1) + s * (A + 1) * cw); a2 = (A + 1) + s * (A - 1) * cw - sA;
    } else { b0 = 1 + al * A; b1 = -2 * cw; b2 = 1 - al * A; a0 = 1 + al / A; a1 = -2 * cw; a2 = 1 - al / A; }
    const w = 2 * Math.PI * f / this.FS, c1 = Math.cos(w), c2 = Math.cos(2 * w), s1 = Math.sin(w), s2 = Math.sin(2 * w);
    const nr = b0 + b1 * c1 + b2 * c2, ni = -(b1 * s1 + b2 * s2), dr = a0 + a1 * c1 + a2 * c2, di = -(a1 * s1 + a2 * s2);
    return 10 * Math.log10((nr * nr + ni * ni) / (dr * dr + di * di));
  },
  peq(bands, f) { let db = 0; for (const p of bands) if (p.on) db += this.biquad(p.type, p.f, p.g, p.q, f); return db; },
  geq(g, f) { let db = 0; D.GEQ_F.forEach((fc, i) => { if (g[i]) db += this.biquad(0, fc, g[i], 1.4, f); }); return db; },
  out(o, f, withPeq = true) { let db = this.xo(f, o.xo.hpF, o.xo.hpT, o.xo.lpF, o.xo.lpT) + (o.on ? o.level : -60); if (withPeq) db += this.peq(o.peq, f); return db; },
};
// grade de frequências logarítmica para desenhar
const FREQS = Array.from({ length: 240 }, (_, i) => 20 * Math.pow(1000, i / 239));

/* =========================================================================
   ASSISTENTE DE ALINHAMENTO — roda no tablet, grátis, sem internet
   ========================================================================= */
const Assist = {
  TARGETS: {
    car: { n: 'Automotiva (grave forte)', fn: f => f < 40 ? 7 : f < 120 ? 7 - (Math.log2(f / 40) / Math.log2(3)) * 5 : f < 250 ? 2 - Math.log2(f / 120) * 2 : f < 1000 ? 0 : -Math.log2(f / 1000) * 1.3 },
    sq: { n: 'Qualidade de som (SQ)', fn: f => f < 60 ? 5 : f < 200 ? 5 - Math.log2(f / 60) * 2.9 : f < 1000 ? 0 : -Math.log2(f / 1000) * 1 },
    spl: { n: 'Paredão / SPL', fn: f => f < 80 ? 10 : f < 200 ? 10 - Math.log2(f / 80) * 6 : f < 2000 ? 2 : 2 - Math.log2(f / 2000) * .8 },
    flat: { n: 'Plana (referência)', fn: () => 0 },
  },
  // ---- medição pelo microfone (RTA em 1/3 de oitava) ----
  rta: { ctx: null, an: null, stream: null, bands: [], avg: null, n: 0, running: false },
  BANDS3: (() => { const out = []; for (let k = -17; k <= 13; k++) out.push(1000 * Math.pow(2, k / 3)); return out; })(), // 20 Hz a 8 kHz... até 20 kHz
  async startMic() {
    const R = this.rta;
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) throw new Error('Este navegador não libera o microfone.');
    R.stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false } });
    R.ctx = new (window.AudioContext || window.webkitAudioContext)();
    const src = R.ctx.createMediaStreamSource(R.stream);
    R.an = R.ctx.createAnalyser(); R.an.fftSize = 16384; R.an.smoothingTimeConstant = .5;
    src.connect(R.an); R.running = true; R.avg = null; R.n = 0;
    R.buf = new Float32Array(R.an.frequencyBinCount);
  },
  stopMic() { const R = this.rta; R.running = false; try { R.stream && R.stream.getTracks().forEach(t => t.stop()); R.ctx && R.ctx.close(); } catch {} R.ctx = null; },
  frame(accumulate) {
    const R = this.rta; if (!R.running || !R.an) return null;
    R.an.getFloatFrequencyData(R.buf);
    const binHz = R.ctx.sampleRate / R.an.fftSize;
    const bands = this.BANDS3.filter(f => f <= 20000).map(fc => {
      const lo = fc / Math.pow(2, 1 / 6), hi = fc * Math.pow(2, 1 / 6);
      let p = 0, c = 0;
      for (let k = Math.max(1, Math.floor(lo / binHz)); k <= Math.ceil(hi / binHz) && k < R.buf.length; k++) { p += Math.pow(10, R.buf[k] / 10); c++; }
      return 10 * Math.log10((p || 1e-12));
    });
    R.bands = bands;
    if (accumulate) { if (!R.avg) R.avg = bands.map(() => 0); R.avg = R.avg.map((v, i) => v + Math.pow(10, bands[i] / 10)); R.n++; }
    return bands;
  },
  averaged() { const R = this.rta; return R.avg && R.n ? R.avg.map(v => 10 * Math.log10(v / R.n)) : null; },
  // normaliza a medição pela região 250 Hz–4 kHz para comparar com a curva-alvo
  normalize(meas, targetFn) {
    const fs = this.BANDS3.filter(f => f <= 20000);
    const diffs = fs.map((f, i) => meas[i] - targetFn(f));
    const ref = fs.map((f, i) => (f >= 250 && f <= 4000 ? diffs[i] : null)).filter(v => v != null);
    const off = ref.reduce((a, b) => a + b, 0) / ref.length;
    return fs.map((f, i) => meas[i] - off);
  },
  geqCorrection(meas, targetFn) {
    const fs = this.BANDS3.filter(f => f <= 20000); const nm = this.normalize(meas, targetFn);
    return D.GEQ_F.map(fc => {
      // média das bandas de 1/3 dentro de ±1/3 oitava do centro do EQ
      const vals = fs.map((f, i) => ({ f, d: nm[i] - targetFn(f) })).filter(x => Math.abs(Math.log2(x.f / fc)) <= .34);
      const dev = vals.reduce((a, x) => a + x.d, 0) / (vals.length || 1);
      let c = -dev * .8;                     // corrige 80% (evita exagero)
      if (fc < 35) c = Math.min(c, 3);       // microfone de tablet mede pouco abaixo de 35 Hz
      return Math.round(clamp(c, -12, 6) * 2) / 2; // prefere cortar a reforçar
    });
  },
  // ---- alinhamento temporal: distâncias até o ouvido do motorista ----
  delaysFromDistances(dists) {
    const valid = dists.filter(d => d > 0); if (!valid.length) return null;
    const max = Math.max(...valid);
    return dists.map(d => d > 0 ? Math.round((max - d) / 34.3 * 10) / 10 : 0); // som: 34,3 cm por milissegundo
  },
  // ---- diagnóstico: revisa tudo e sugere correções ----
  diagnose(s) {
    const tips = []; const add = (lv, t, d, fix) => tips.push({ lv, t, d, fix });
    const outs = s.outs.map((o, i) => ({ o, i, role: /\bsub/i.test(o.name) ? 'sub' : /tweet/i.test(o.name) ? 'tweeter' : Dsp.role(o) }));
    const nm = i => `${s.outs[i].name} (saída ${i + 1})`;
    const LR24 = XT('lr', 24);
    for (const { o, i, role } of outs) {
      if (!o.on) continue;
      const x = o.xo;
      if (/tweet/i.test(o.name) && (!x.hpT || x.hpF < 1200))
        add('p', `Tweeter sem proteção em ${nm(i)}`, `O corte de graves está ${x.hpT ? 'em ' + x.hpF + ' Hz' : 'desligado'}. Grave no tweeter queima a bobina.`, () => { x.hpF = Math.max(x.hpF, 2500); x.hpT = LR24; x.preset = 0; Dsp.send.xo(i); });
      if (role === 'tweeter' && x.hpT && D.XO_TYPES[x.hpT].s < 24)
        add('a', `Corte suave demais no tweeter (${nm(i)})`, `${D.XO_TYPES[x.hpT].n} deixa passar grave. Use 24 dB ou mais.`, () => { x.hpT = LR24; x.preset = 0; Dsp.send.xo(i); });
      if (role === 'sub' && (!x.lpT || x.lpF > 160))
        add('a', `Sub tocando médios em ${nm(i)}`, 'Sem corte de agudos o sub "fala" e embola a voz. Sugestão: 80 Hz em 24 dB.', () => { x.lpF = 80; x.lpT = LR24; x.preset = 0; Dsp.send.xo(i); });
      if (role === 'sub' && (!x.hpT || x.hpF < 20))
        add('d', `Sem filtro subsônico em ${nm(i)}`, 'Um corte em 25–30 Hz protege o alto-falante de excursão inútil e ganha pressão útil.', () => { x.hpF = 28; x.hpT = XT('bt', 12); x.preset = 0; Dsp.send.xo(i); });
      if (o.level > 0) add('a', `Nível acima de 0 dB em ${nm(i)}`, `Está em +${o.level} dB. Pode distorcer o sinal antes do módulo.`, () => { o.level = 0; Dsp.send.level(i); });
      if (role === 'tweeter' && !o.lim.peakOn && !o.lim.rmsOn)
        add('d', `Limitador desligado no tweeter (${nm(i)})`, 'Ligue o limitador de pico para proteger em volume alto.', () => { o.lim.peakOn = true; o.lim.peakThr = -3; Dsp.send.lim(i); });
      const hot = o.peq.filter(p => p.on && p.g > 6);
      if (hot.length) add('a', `Reforço forte no paramétrico de ${nm(i)}`, `${hot.map(p => p.f + ' Hz +' + p.g + ' dB').join(', ')}. Prefira cortar o que sobra a reforçar o que falta.`);
      const sharp = o.peq.filter(p => p.on && p.g > 3 && p.q > 6);
      if (sharp.length) add('d', `Filtro muito estreito com reforço em ${nm(i)}`, 'Q alto com reforço soa "apitado". Use Q até 4 para reforços.');
      if (o.sub.on && o.sub.gain > 6) add('a', `Subgrave alto em ${nm(i)}`, `Ganho de ${o.sub.gain} dB no subgrave esquenta a bobina. Comece com 3 dB.`, () => { o.sub.gain = 3; Dsp.send.sub(i); });
    }
    // buracos e sobreposições entre faixas
    const byRole = r => outs.filter(x => x.o.on && x.role === r);
    const present = ['sub', 'grave', 'medio', 'tweeter'].filter(r => byRole(r).length);
    const pairs = present.slice(1).map((r, k) => [present[k], r]); // só faixas vizinhas
    for (const [a, b] of pairs) {
      const A = byRole(a), B = byRole(b); if (!A.length || !B.length) continue;
      const lpA = Math.min(...A.map(x => x.o.xo.lpT ? x.o.xo.lpF : 22000)), hpB = Math.max(...B.map(x => x.o.xo.hpT ? x.o.xo.hpF : 10));
      if (hpB > lpA * 1.6) add('a', `Buraco entre ${ROLE_NAMES[a]} e ${ROLE_NAMES[b]}`, `${ROLE_NAMES[a]} corta em ${lpA} Hz e ${ROLE_NAMES[b]} só começa em ${hpB} Hz. Falta som nessa faixa.`,
        () => { B.forEach(x => { x.o.xo.hpF = lpA; x.o.xo.preset = 0; Dsp.send.xo(x.i); }); });
      else if (lpA > hpB * 2.2) add('d', `Sobreposição entre ${ROLE_NAMES[a]} e ${ROLE_NAMES[b]}`, `Os dois tocam de ${hpB} a ${lpA} Hz. Pode dar pico ou cancelamento; aproxime os cortes.`);
      const tA = A[0].o.xo.lpT, tB = B[0].o.xo.hpT;
      if (tA && tB && D.XO_TYPES[tA].fam !== D.XO_TYPES[tB].fam) add('d', `Filtros de tipos diferentes entre ${ROLE_NAMES[a]} e ${ROLE_NAMES[b]}`, 'No mesmo ponto de corte, use o mesmo tipo dos dois lados (de preferência Linkwitz-Riley 24 dB) para somar certinho.');
      if (tA && tB && D.XO_TYPES[tA].fam === 'lr' && D.XO_TYPES[tA].s === 24 && A[0].o.phase !== B[0].o.phase) add('d', `Fase invertida entre ${ROLE_NAMES[a]} e ${ROLE_NAMES[b]}`, 'Com Linkwitz-Riley 24 dB os dois lados ficam em fase. Teste ouvindo: a posição com mais grave na região do corte é a certa.');
    }
    if (s.geq.g.some(g => g > 6)) add('a', 'Equalizador gráfico com reforço acima de 6 dB', 'Reforços grandes tiram margem do sinal e causam distorção. Abaixe o resto em vez de subir uma banda.', () => { const mx = Math.max(...s.geq.g); s.geq.g = s.geq.g.map(g => Math.round((g - (mx - 6)) * 2) / 2); Dsp.send.geq(); });
    if (s.outs.every(o => !o.delay) && s.outs.filter(o => o.on).length > 2) add('d', 'Sem alinhamento temporal', 'Os falantes estão a distâncias diferentes de você. Use "Alinhar tempo" abaixo com uma fita métrica: o palco fica centralizado.');
    if (!tips.length) add('ok', 'Nada de errado encontrado', 'Os cortes, níveis e proteções estão coerentes. Agora vale medir com o microfone.');
    const order = { p: 0, a: 1, d: 2, ok: 3 };
    return tips.sort((x, y) => order[x.lv] - order[y.lv]);
  },
};

/* =========================================================================
   BIBLIOTECA: leitura do pendrive em blocos, cache e organização automática
   ========================================================================= */
const GENRES = [
  ['FORRÓ', ['forro', 'pe de serra', 'xote', 'baiao'], 'nordeste'],
  ['PISEIRO', ['piseiro', 'pisadinha'], 'nordeste'],
  ['VAQUEJADA', ['vaquejada'], 'nordeste'],
  ['PAGODE', ['pagode', 'pagodao'], 'samba'],
  ['SAMBA', ['samba'], 'samba'],
  ['SWINGUEIRA', ['swingueira'], 'samba'],
  ['SERTANEJO', ['sertanejo', 'sertaneja', 'modao', 'universitario'], 'sert'],
  ['ARROCHA', ['arrocha'], 'sert'],
  ['BREGA', ['brega', 'bregadeira'], 'brega'],
  ['MELODY', ['melody', 'tecnomelody', 'tecno melody'], 'brega'],
  ['FUNK', ['funk', 'mandela', 'baile'], 'funk'],
  ['RAP / TRAP', ['rap', 'trap', 'hip hop', 'hiphop'], 'funk'],
  ['ELETRÔNICA', ['eletronica', 'eletronico', 'electro', 'house', 'edm', 'techno', 'automotivo'], 'ele'],
  ['AXÉ', ['axe'], 'axe'],
  ['REGGAE', ['reggae', 'regueiro'], 'reg'],
  ['ROCK', ['rock'], 'rock'],
  ['POP', ['pop'], 'pop'],
  ['GOSPEL', ['gospel', 'louvor'], 'gos'],
  ['MPB', ['mpb'], 'mpb'],
  ['FLASHBACK', ['flashback', 'anos 80', 'anos 90', '80 e 90'], 'flash'],
  ['KIZOMBA', ['kizomba', 'zouk'], 'kiz'],
  ['INTERNACIONAL', ['internacional', 'international'], 'int'],
];
const GENRE_RX = GENRES.map(([name, words, fam]) => ({ name, fam, rx: new RegExp('(^|[^a-z0-9])(' + words.map(w => w.replace(/ /g, '\\s*')).join('|') + ')([^a-z0-9]|$)') }));
function genreOf(text) { const n = norm(text); for (const g of GENRE_RX) if (g.rx.test(n)) return g; return null; }
const SEP_RX = /^\s*([^_\-–:/\\|]{2,30}?)\s*(?:\s[-–]\s|_|:|\/|\\|\|)\s*(.+)$/;

const Organizer = {
  build(folders) {
    const groups = new Map(); const byFolder = new Map();
    const add = (gname, f, display) => {
      if (!groups.has(gname)) groups.set(gname, { key: gname, name: gname, folders: [], songs: 0 });
      const g = groups.get(gname); g.folders.push({ id: f.id, display }); g.songs += f.count || 0; byFolder.set(f.id, gname);
    };
    let scope = null; // pasta vazia que funciona como "pai" (ex.: FORRÓ com as bandas dentro)
    for (let i = 0; i < folders.length; i++) {
      const f = folders[i];
      if (!f || !f.loaded) continue;
      const name = f.name || (f.id === 0 ? 'Pasta principal' : `Pasta ${f.id + 1}`);
      if (!f.count) {
        const next = folders[i + 1];
        if (next && next.loaded && next.count) { const g = genreOf(name); scope = { name: g ? g.name : name.toUpperCase(), fam: g && g.fam }; }
        continue;
      }
      const m = name.match(SEP_RX);
      const gSep = m && genreOf(m[1]);
      if (gSep) { scope = null; add(gSep.name, f, m[2].trim()); continue; }
      const g = genreOf(name);
      if (scope && (!g || g.fam === scope.fam || g.name === scope.name)) { add(scope.name, f, name); continue; }
      scope = null;
      add(g ? g.name : 'OUTRAS', f, name);
    }
    const list = [...groups.values()].sort((a, b) => (a.key === 'OUTRAS') - (b.key === 'OUTRAS') || b.songs - a.songs);
    list.forEach(g => g.folders.sort((a, b) => a.display.localeCompare(b.display, 'pt-BR')));
    return { groups: list, byFolder };
  },
};

const Library = {
  proto: null, sig: '', folders: [], names: new Map(), total: { folders: 0, songs: 0 }, org: { groups: [], byFolder: new Map() },
  phase: 'idle', loadedFolders: 0, priority: [], listeners: new Set(), _token: 0, error: '',
  on(fn) { this.listeners.add(fn); return () => this.listeners.delete(fn); },
  emit(what, data) { this.listeners.forEach(fn => { try { fn(what, data); } catch (e) { console.error(e); } }); },
  folder(id) { return this.folders[id]; },
  folderOfSong(idx) { return this.folders.find(f => f && f.loaded && idx >= f.first && idx < f.first + f.count); },
  displayName(id) {
    const f = this.folders[id]; if (!f) return '';
    const g = this.org.byFolder.get(id); const grp = g && this.org.groups.find(x => x.key === g);
    const e = grp && grp.folders.find(x => x.id === id); return (e && e.display) || f.name;
  },
  songTitle(idx) {
    const n = this.names.get(idx); if (!n) return `Faixa ${idx + 1}`;
    return n.replace(/\.(mp3|wma|wav|flac|aac|m4a)$/i, '').replace(/^\d{1,3}\s*[-_.]\s*/, '').trim() || n;
  },
  keyOf(idx) { const f = this.folderOfSong(idx); return `${f ? f.name : '?'}::${this.names.get(idx) || idx}`; },
  resolve(key, fallback) {
    const [fn, sn] = key.split('::');
    const f = this.folders.find(x => x && x.loaded && x.name === fn);
    if (f) for (let i = f.first; i < f.first + f.count; i++) if (this.names.get(i) === sn) return i;
    return fallback;
  },
  _save() {
    clearTimeout(this._st);
    this._st = setTimeout(() => {
      const data = { f: this.folders.filter(x => x && x.loaded).map(x => [x.id, x.name, x.first, x.count]), n: [...this.names.entries()] };
      try { localStorage.setItem('stxc.lib:' + this.sig, JSON.stringify(data)); } catch {}
    }, 400);
  },
  _loadCache() {
    try {
      const raw = localStorage.getItem('stxc.lib:' + this.sig); if (!raw) return 0;
      const d = JSON.parse(raw);
      for (const [id, name, first, count] of d.f) this.folders[id] = { id, name, first, count, loaded: true };
      for (const [i, n] of d.n) this.names.set(i, n);
      return d.f.length;
    } catch { return 0; }
  },
  reorganize() { this.org = Organizer.build(this.folders); },
  prioritize(id) { this.priority = [id, ...this.priority.filter(x => x !== id)]; },
  async scan(proto) {
    this.proto = proto; const token = ++this._token;
    this.phase = 'status'; this.error = ''; this.emit('phase');
    const st = await proto.status();
    if (token !== this._token) return;
    if (!st) { this.phase = 'error'; this.error = 'O processador não respondeu.'; this.emit('phase'); return; }
    if (!st.connected || !st.folders) { this.phase = 'nousb'; this.emit('phase'); return; }
    this.total = { folders: st.folders, songs: st.songs };
    this.sig = `${st.folders}-${st.songs}`;
    this.folders = Array.from({ length: st.folders }, (_, id) => ({ id, loaded: false }));
    this.names = new Map();
    const fromCache = this._loadCache();
    this.loadedFolders = this.folders.filter(f => f.loaded).length;
    this.reorganize();
    this.phase = 'folders'; this.emit('phase'); this.emit('folders');
    if (fromCache) this.emit('toast', `Pendrive reconhecido: ${fromCache} pastas carregadas do cache.`);
    // 1) pastas em blocos de 6, sem travar a tela
    const BLOCK = 6;
    while (token === this._token) {
      const pending = [...this.priority.filter(id => this.folders[id] && !this.folders[id].loaded),
        ...this.folders.filter(f => !f.loaded).map(f => f.id)];
      const block = [...new Set(pending)].slice(0, BLOCK);
      if (!block.length) break;
      for (const id of block) {
        const r = await proto.folder(id, this.priority.includes(id));
        if (token !== this._token) return;
        this.folders[id] = r ? { ...r, id, loaded: true } : { id, name: `Pasta ${id + 1}`, first: 0, count: 0, loaded: true, failed: true };
      }
      this.loadedFolders = this.folders.filter(f => f.loaded).length;
      this.reorganize(); this._save();
      this.emit('folders', block);
      await sleep(16);
    }
    // 2) nomes das músicas em segundo plano, pasta por pasta (a pasta aberta tem prioridade)
    this.phase = 'names'; this.emit('phase');
    const order = this.org.groups.flatMap(g => g.folders.map(x => x.id));
    while (token === this._token) {
      const next = [...this.priority, ...order].find(id => { const f = this.folders[id]; return f && f.count && !this._folderNamed(f); });
      if (next == null) break;
      await this.ensureNames(next, false, token);
      await sleep(30);
    }
    if (token === this._token) { this.phase = 'done'; this.emit('phase'); this._save(); }
  },
  _folderNamed(f) { for (let i = f.first; i < f.first + f.count; i++) if (!this.names.has(i)) return false; return true; },
  async ensureNames(id, priority = true, token = this._token) {
    const f = this.folders[id]; if (!f || !f.loaded || !f.count || !this.proto) return;
    if (priority) this.prioritize(id);
    const B = 8;
    for (let s = f.first; s < f.first + f.count; s += B) {
      const idxs = []; for (let i = s; i < Math.min(s + B, f.first + f.count); i++) if (!this.names.has(i)) idxs.push(i);
      if (!idxs.length) continue;
      for (const i of idxs) { const n = await this.proto.fileName(i, priority); if (token !== this._token) return; if (n) this.names.set(i, n); }
      this.emit('names', id); this._save();
    }
    this.priority = this.priority.filter(x => x !== id);
  },
  search(q) {
    const n = norm(q); if (n.length < 2) return { folders: [], songs: [] };
    const folders = this.folders.filter(f => f && f.loaded && f.count && norm(f.name).includes(n)).slice(0, 12);
    const songs = []; for (const [i, name] of this.names) if (norm(name).includes(n)) { songs.push(i); if (songs.length > 120) break; }
    return { folders, songs: songs.sort((a, b) => a - b) };
  },
};

/* =========================================================================
   PLAYER: tocar com verificação, fila, histórico, favoritos e playlists
   ========================================================================= */
const Player = {
  proto: null, idx: -1, playing: false, pos: 0, dur: 0, mode: 0, vol: 20, folderName: '',
  queue: [], history: Store.get('hist', []), favs: new Set(Store.get('favs', [])), playlists: Store.get('pls', []),
  listeners: new Set(), _lastPos: 0, _expect: 0, _busy: false,
  on(fn) { this.listeners.add(fn); return () => this.listeners.delete(fn); },
  emit(w, d) { this.listeners.forEach(fn => { try { fn(w, d); } catch (e) { console.error(e); } }); },
  attach(proto) { this.proto = proto; this._poll(); },
  async _poll() {
    let n = 0;
    while (true) {
      await sleep(1000);
      if (!this.proto || this._busy) continue;
      const t = await this.proto.time();
      if (t) {
        const jumped = this.dur && (t.total !== this.dur || t.cur + 2 < this._lastPos);
        this.pos = t.cur; this.dur = t.total;
        if (jumped && Date.now() > this._expect) this._onExternalChange();
        else if (this.queue.length && this.playing && t.total && t.cur >= t.total - 1 && Date.now() > this._expect) this._playQueued();
        this._lastPos = t.cur;
      }
      if (n % 3 === 0) {
        const s = await this.proto.state(); if (s != null) this.playing = s === 1;
        const fn = await this.proto.folderName(); if (fn != null) this.folderName = fn;
      }
      n++;
      this.emit('tick');
    }
  },
  _onExternalChange() {
    if (this.queue.length) return this._playQueued();
    // o aparelho avançou sozinho: descobre a faixa nova
    const t = this.proto.t;
    if (t.peekIndex) this.idx = t.peekIndex();
    else if (this.idx >= 0) {
      const f = Library.folderOfSong(this.idx);
      this.idx = this.mode === 1 ? this.idx : (f && this.mode === 2 && this.idx + 1 >= f.first + f.count ? f.first : this.idx + 1);
    }
    if (this.idx >= 0) this._pushHistory(this.idx);
    this.emit('track');
  },
  _playQueued() { const it = this.queue.shift(); if (it) this.playTrack(this._resolve(it), { silent: true }); this.emit('queue'); },
  _resolve(it) { return typeof it === 'number' ? it : Library.resolve(it.k, it.i); },
  async _verify(target) {
    const f = Library.folderOfSong(target);
    for (let k = 0; k < 4; k++) {
      await sleep(320);
      const tr = this.proto.t;
      if (tr.peekIndex) { if (tr.peekIndex() === target) return true; continue; }
      const t = await this.proto.time(); const fn = await this.proto.folderName();
      if (t && t.cur <= 4 && f && fn != null && norm(fn).slice(0, 14) === norm(f.name).slice(0, 14)) return true;
    }
    return false;
  },
  async playTrack(idx, { silent = false } = {}) {
    if (idx == null || idx < 0 || !this.proto) return false;
    this._busy = true; this._expect = Date.now() + 4000;
    const pr = this.proto, data = [idx & 255, idx >> 8];
    const cur = this.idx, curF = Library.folderOfSong(cur), tgtF = Library.folderOfSong(idx);
    const ways = [
      ['direto', () => pr.cmd(P.PLAY_ID, data)],
      ['reenvio', async () => { await sleep(200); await pr.cmd(P.PLAY_ID, data); }],
      ['fonte USB', async () => { await pr.cmd(P.SOURCE, [0]); await sleep(350); await pr.cmd(P.PLAY_ID, data); }],
      ['pausa e play', async () => { await pr.cmd(P.PLAYPAUSE); await sleep(150); await pr.cmd(P.PLAY_ID, data); }],
    ];
    if (cur >= 0 && curF && tgtF && curF.id === tgtF.id && Math.abs(idx - cur) <= 6 && idx !== cur)
      ways.push(['passo a passo', async () => { const d = idx - cur; for (let i = 0; i < Math.abs(d); i++) { await pr.cmd(d > 0 ? P.NEXT : P.PREV); await sleep(120); } }]);
    let ok = false, used = 0;
    for (let a = 0; a < ways.length && !ok; a++) { used = a; await ways[a][1](); ok = await this._verify(idx); }
    this._busy = false; this._expect = Date.now() + 2500;
    if (ok) {
      this.idx = idx; this.playing = true; this.pos = 0; this._lastPos = 0;
      this._pushHistory(idx);
      if (used > 0) this.emit('toast', { kind: 'ok', text: `Tocando. O aparelho ignorou o primeiro comando; resolvido por "${ways[used][0]}".` });
      this.emit('track');
    } else this.emit('toast', { kind: 'bad', text: silent ? 'A próxima da fila não tocou. Tente pela lista.' : 'Não consegui tocar essa faixa. Confira se o pendrive está na fonte USB.' });
    return ok;
  },
  async toggle() { await this.proto.cmd(P.PLAYPAUSE); this.playing = !this.playing; this.emit('tick'); },
  async next() {
    if (this.queue.length) return this._playQueued();
    this._expect = Date.now() + 2500; await this.proto.cmd(P.NEXT); await sleep(300);
    const t = this.proto.t; this.idx = t.peekIndex ? t.peekIndex() : this.idx + 1; this._pushHistory(this.idx); this.emit('track');
  },
  async prev() {
    this._expect = Date.now() + 2500; await this.proto.cmd(P.PREV); await sleep(300);
    const t = this.proto.t; this.idx = t.peekIndex ? t.peekIndex() : Math.max(0, this.idx - 1); this.emit('track');
  },
  async folderStep(dir) {
    this._expect = Date.now() + 2500; await this.proto.cmd(dir > 0 ? P.NEXT_FOLDER : P.PREV_FOLDER); await sleep(350);
    const t = this.proto.t;
    if (t.peekIndex) this.idx = t.peekIndex();
    else { const fn = await this.proto.folderName(); const f = Library.folders.find(x => x && x.loaded && x.name === fn); if (f) this.idx = f.first; }
    this._pushHistory(this.idx); this.emit('track');
  },
  async setMode(m) { this.mode = m; await this.proto.cmd(P.MODE, [m]); this.emit('tick'); },
  async setVolume(v) { this.vol = v; clearTimeout(this._vt); this._vt = setTimeout(() => this.proto.cmd(P.VOLUME_SET, [v]), 120); },
  async seek(pct) { this._expect = Date.now() + 2500; await this.proto.cmd(P.SEEK, [Math.round(pct * 100)]); this.pos = Math.round(this.dur * pct); this._lastPos = this.pos; this.emit('tick'); },
  // ---- fila ----
  enqueue(idx, next = false) { const it = { k: Library.keyOf(idx), i: idx }; next ? this.queue.unshift(it) : this.queue.push(it); this.emit('queue'); },
  removeQueued(n) { this.queue.splice(n, 1); this.emit('queue'); },
  upcoming(n = 12) {
    const out = this.queue.map(it => ({ idx: this._resolve(it), queued: true }));
    let i = this.idx; const f = Library.folderOfSong(i);
    while (out.length < n && i >= 0 && this.mode !== 3) {
      if (this.mode === 1) break;
      i++;
      if (this.mode === 2 && f && i >= f.first + f.count) i = f.first;
      if (i >= Library.total.songs) break;
      if (i === this.idx) break;
      out.push({ idx: i, queued: false });
    }
    return out.slice(0, n);
  },
  // ---- histórico, favoritos, playlists ----
  _pushHistory(idx) {
    if (idx < 0) return; const k = Library.keyOf(idx);
    if (this.history[0] && this.history[0].k === k) return;
    this.history.unshift({ k, i: idx, at: Date.now() }); this.history = this.history.slice(0, 150); Store.set('hist', this.history);
  },
  isFav(idx) { return this.favs.has(Library.keyOf(idx)); },
  toggleFav(idx) { const k = Library.keyOf(idx); this.favs.has(k) ? this.favs.delete(k) : this.favs.add(k); Store.set('favs', [...this.favs]); this.emit('favs'); return this.favs.has(k); },
  createPlaylist(name) { const pl = { id: Date.now().toString(36), name, items: [] }; this.playlists.push(pl); this._savePl(); return pl; },
  addToPlaylist(id, idx) { const pl = this.playlists.find(p => p.id === id); if (!pl) return; const k = Library.keyOf(idx); if (!pl.items.some(x => x.k === k)) pl.items.push({ k, i: idx }); this._savePl(); },
  removeFromPlaylist(id, n) { const pl = this.playlists.find(p => p.id === id); if (pl) { pl.items.splice(n, 1); this._savePl(); } },
  deletePlaylist(id) { this.playlists = this.playlists.filter(p => p.id !== id); this._savePl(); },
  renamePlaylist(id, name) { const pl = this.playlists.find(p => p.id === id); if (pl) { pl.name = name; this._savePl(); } },
  _savePl() { Store.set('pls', this.playlists); this.emit('pls'); },
  async playList(items, shuffle = false) {
    const list = items.map(it => ({ ...it })); if (shuffle) list.sort(() => Math.random() - .5);
    const first = list.shift(); if (!first) return;
    this.queue = list; this.emit('queue');
    await this.playTrack(this._resolve(first));
  },
};

  /* ---------- eventos ---------- */
  onLib(w, d) {
    const c = this.cur();
    if (w === 'toast') return this.toast(d);
    if (w === 'phase' || w === 'folders') {
      this.updateScanbar();
      if (w === 'phase' && (Library.phase === 'error' || Library.phase === 'nousb' || Library.phase === 'folders') && c.v === 'lib') return this.renderLibBody();
      const ls = $('#libsub'); if (ls && Library.total.folders) ls.textContent = `${Library.total.folders} pastas · ${Library.total.songs} músicas · organizadas automaticamente por estilo`;
      if (w === 'folders') {
        // atualiza no lugar, mantendo onde você está
        if (c.v === 'lib' && !this.q) { const y = this.main.scrollTop; this.renderLibBody(); this.main.scrollTop = y; }
        else if (c.v === 'genre') { const y = this.main.scrollTop; this.refresh(); this.main.scrollTop = y; }
        else if (c.v === 'folder' && d && d.includes(c.id) && !$('#songlist')) this.refresh();
      }
    }
    if (w === 'names') {
      if (c.v === 'folder' && d === c.id) {
        const f = Library.folder(c.id);
        for (let i = f.first; i < f.first + f.count; i++) {
          const row = document.querySelector(`.row[data-i="${i}"]`);
          if (row && row.classList.contains('skel') && Library.names.has(i)) { row.classList.remove('skel'); row.querySelector('.t b').textContent = Library.songTitle(i); }
        }
      }
      if (c.v === 'lib' && this.q) this.renderLibBody();
      if (Player.idx >= 0) { const f = Library.folderOfSong(Player.idx); if (f && f.id === d) this.paintNow(); }
    }
  },
  onPlayer(w, d) {
    if (w === 'toast') return this.toast(d.text, d.kind);
    if (w === 'track') { this.paintNow(); if (this.cur().v === 'hist') this.refresh(); }
    if (w === 'tick') this.paintTick();
    if (w === 'queue') this.paintQueue();
  },

  /* ---------- diálogos ---------- */
  toast(text, kind = '') {
    const t = h('div', { class: 'toast ' + kind, role: 'status' }, text);

    while (this.toasts.children.length > 3) this.toasts.firstChild.remove();

  modal({ title, text, body, actions = [] }) {

    ov.addEventListener('click', e => { if (e.target === ov) close(); });
    ov.append(h('div', { class: 'modal' }, h('h2', {}, title), text ? h('p', {}, text) : null, body || null,
      h('div', { class: 'acts' }, actions.map(a => h('button', { class: 'btn ' + (a.kind || ''), onclick: () => { const r = a.onClick && a.onClick(); if (r !== false) close(); } }, a.label)))));
    document.body.append(ov);
    const f = ov.querySelector('input,textarea,.btn.primary'); if (f) setTimeout(() => f.focus(), 30);
    return close;

    });

const Gate = {
  st: null, _sig: '',
  tick(force) {
    const st = License.evaluate(); this.st = st;
    const sig = st.state + '|' + st.notices.map(n => n.kind + n.text).join() + '|' + (st.until | 0);
    if (force || sig !== this._sig) {
      const changed = this._state && this._state !== st.state; this._state = st.state;
      this._sig = sig; this.paintPill(); this.paintBanners(); this.paintLock(); if (force && UI.cur().v === 'lic') UI.refresh();
      if (changed) Telemetry.ping(st.state); // registra na planilha quando a situação muda (ex.: teste acabou, ativou chave)
    }
    this.paintCount(); this.paintBannerTimes();
  },
  paintPill() {
    const st = this.st, p = $('#licpill'); if (!p) return;
    const left = st.until ? splitTime(st.until - st.now) : null;
    const map = {
      trial: ['warn', `Teste: ${left ? left.d : 0} dias`], active: ['ok', 'Licença ativa'], free: ['ok', 'Liberado'],
      expired: ['bad', 'Aluguel vencido'], trialover: ['bad', 'Teste encerrado'], blocked: ['bad', 'Bloqueado'], update: ['bad', 'Atualizar'],
    };

      else if (n.kind === 'expiring') z.append(h('div', { class: 'banner' }, ic('hist'), h('span', { class: 'grow' }, h('b', {}, n.text), ' Termina em ', h('span', { class: 'num', 'data-until': n.until }, '…'), '.'), h('button', { class: 'btn primary', onclick: () => UI.switchTab('lic') }, 'Renovar')));
      else if (n.kind === 'bad') z.append(h('div', { class: 'banner bad' }, ic('lock'), h('span', { class: 'grow' }, h('b', {}, n.text), n.until ? [' Bloqueio em ', h('span', { class: 'num', 'data-until': n.until }, '…'), '.'] : ''), h('a', { class: 'btn', href: `https://wa.me/${CONFIG.WHATSAPP}`, target: '_blank', rel: 'noopener' }, 'Falar comigo')));
      else z.append(h('div', { class: 'banner' }, ic('info'), h('span', { class: 'grow' }, n.text)));
    }
  },
  paintBannerTimes() {

  },
  paintLock() {

    if (!locked) { if (old) old.remove(); return; }

        st.url ? h('a', { class: 'btn primary', href: st.url, target: '_blank', rel: 'noopener', style: { height: '52px', fontSize: '16px' } }, ic('dl'), 'Baixar nova versão') : null,

const App = {
  transport: null, proto: null,
  async boot() {
    try { await Device.init(); } catch (e) { console.error(e); }
    await License.initTrial();
    await Remote.loadCached();
    Dsp.init(null);
    UI.init();
    Gate.tick(true);
    this.transport = new SimTransport();
    this.proto = new StxProtocol(this.transport);
    await this.transport.connect();
    Dsp.proto = this.proto; Dsp.seedSim(this.transport);
    this.paintConn();
    Player.attach(this.proto);
    Library.scan(this.proto);
    setTimeout(() => $('#splash').classList.add('out'), 500);
    setTimeout(() => $('#splash') && $('#splash').remove(), 1200);
    // internet: config assinada (bloqueio, versão, preços) e contador de usuários
    // registro na planilha: uma vez por abertura (depois do nome)
    UI.onboard().then(() => Telemetry.ping(Gate.st.state));
    const online = async () => { await Remote.refresh(); Gate.tick(true); };
    online(); setInterval(online, 60000);
    setInterval(() => UI.updateScanbar(), 400);
  },
  paintConn() {
    const tr = this.transport, ble = tr instanceof BleTransport;
    const st = ble ? tr.state : 'demo';
    const map = { demo: ['warn', 'Demonstração'], connected: ['ok', tr && tr.name], connecting: ['warn', 'Conectando…'], reconnecting: ['warn', 'Reconectando…'], off: ['bad', 'Desconectado'] };
    const [k, t] = map[st] || ['warn', st];
    for (const id of ['#conn', '#f-conn']) { const el = $(id); if (el) { el.className = (id === '#conn' ? 'pill btn ' : 'pill ') + k; el.replaceChildren(h('i'), t); } }
  },
  useTransport(tr) {
    this.transport = tr;
    this.proto = new StxProtocol(tr);
    Player.proto = this.proto; Player.idx = -1; Player.queue = [];
    Dsp.proto = this.proto; Dsp.synced = !(tr instanceof BleTransport);
    this.paintConn();
    Library.scan(this.proto);
    if (UI.cur().v === 'dsp' || UI.cur().v === 'lib') UI.refresh();
  },
  async connectBle() {
    if (!BleTransport.available()) throw new Error('Este navegador não tem Bluetooth web. Abra o app pelo Chrome, no link https.');
    const tr = new BleTransport();
    tr.onStatus = () => { this.paintConn(); if (tr.state === 'off' && this.transport === tr) UI.toast('Processador desconectado.', 'bad'); };
    tr.onReconnect = () => { UI.toast('Reconectado.', 'ok'); Library.scan(this.proto); };
    await tr.connect();
    this.useTransport(tr);
    UI.toast(`Conectado em ${tr.name}.`, 'ok');
    this.syncDsp();
  },
  async syncDsp() {
    Dsp.syncing = true; Dsp.emit('sync');
    const r = await Dsp.readAll((a, b) => { Dsp.syncProgress = [a, b]; Dsp.emit('sync'); });
    Dsp.syncing = false; Dsp.synced = r.ok > 0; Dsp.lastRead = r; Dsp.emit('sync');
    if (UI.cur().v === 'dsp') UI.refresh();
  },
  backToDemo() {
    if (this.transport instanceof BleTransport) this.transport.disconnect();
    const sim = new SimTransport(); this.useTransport(sim); Dsp.seedSim(sim);
  },
  rescan(clear) {
    if (clear) { try { Object.keys(localStorage).filter(k => k.startsWith('stxc.lib:')).forEach(k => localStorage.removeItem(k)); } catch {} }
    Library.scan(this.proto);
  },
};

  /* ---------- EQ PARAMÉTRICO (saídas e entrada) ---------- */

        G.curve(c, f => (xoOut ? Resp.out(xoOut, f, true) - (xoOut.on ? xoOut.level : -60) : Resp.peq(bands, f)), color, 3, true);
        bands.forEach((p, i) => { if (!p.on) return; const x = G.x(p.f), y = G.y(p.type ? p.g / 2 : p.g); c.beginPath(); c.arc(x, y, i === self.peqSel ? 11 : 8, 0, 7); c.fillStyle = i === self.peqSel ? '#fff' : D.COLORS[i]; c.fill(); c.fillStyle = '#0b0f15'; c.font = 'bold 10px Manrope'; c.fillText(String(i + 1), x - 3, y + 3.5); });

        move: (i, f, db) => { const b = bands[i]; b.f = f; b.g = clamp(Math.round((b.type ? db * 2 : db) * 10) / 10, -12, 12); sendBand(i); syncRow(i); },
        end: () => drawRows(),

    const rowEls = [];
