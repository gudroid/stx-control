      h('div', { class: 'panel' }, h('h3', {}, 'Salvar a regulagem atual'),
        h('div', { class: 'field' }, h('label', { for: 'pname' }, 'NOME DO PRESET'), name),
        h('div', { style: { display: 'flex', gap: '8px', flexWrap: 'wrap' } },
          h('button', { class: 'btn primary', onclick: () => { const n = name.value.trim() || `Regulagem ${new Date().toLocaleString('pt-BR')}`; Dsp.savePreset(n); this.toast(`Preset "${n}" salvo neste tablet.`, 'ok'); this.refresh(); } }, ic('save'), 'Salvar preset'),
          h('button', { class: 'btn', onclick: () => file.click() }, ic('up'), 'Importar arquivo'), file)),
      h('div', { class: 'panel' }, h('h3', {}, 'Começar do zero'),
        h('p', { style: { color: 'var(--muted)', fontSize: '13px', margin: '0 0 10px' } }, 'Volta para o ponto de partida: 2 subs, médio-grave, médio e tweeter com cortes seguros, tudo em 0 dB.'),
        h('button', { class: 'btn', onclick: async () => { if (await this.confirm('Voltar ao padrão?', 'Todas as regulagens atuais serão substituídas no processador. Salve um preset antes, se quiser guardar.')) { await this.withProgress('Enviando padrão', cb => Dsp.loadPreset(defaultState(), cb)); this.refresh(); } } }, ic('refresh'), 'Aplicar padrão'))),
      h('div', { class: 'section-title' }, h('h2', {}, 'Presets salvos'), h('small', {}, `${list.length} no tablet`)),
      list.length ? h('div', { class: 'glist' }, list.map(p => h('div', { class: 'gl-row', style: { gridTemplateColumns: '46px minmax(0,1fr) auto' } },
        h('span', { class: 'bd', style: artStyle('p' + p.name, true) }, initials(p.name)),
        h('div', {}, h('b', {}, p.name), h('small', {}, new Date(p.at).toLocaleString('pt-BR'))),
        h('div', { style: { display: 'flex', gap: '6px', flexWrap: 'wrap', justifyContent: 'flex-end' } },
          h('button', { class: 'btn primary', style: { height: '36px' }, onclick: async () => { await this.withProgress(`Aplicando "${p.name}"`, cb => Dsp.loadPreset(p.s, cb)); this.toast('Preset aplicado no processador.', 'ok'); } }, 'Aplicar'),
          h('button', { class: 'btn', style: { height: '36px' }, onclick: () => this.exportPreset(p) }, ic('dl'), 'Exportar'),
          iconBtn('trash', 'Apagar', async () => { if (await this.confirm('Apagar preset?', `"${p.name}" será apagado deste tablet.`)) { Dsp.deletePreset(p.id); this.refresh(); } }))))) :
        this.emptyBox('Nenhum preset salvo', 'Salve sua regulagem para voltar nela depois ou mandar para outro carro.'));
  },
  exportPreset(p) {
    const txt = JSON.stringify({ app: 'STX Control', name: p.name, at: p.at, s: p.s });
    try {
      const a = h('a', { href: URL.createObjectURL(new Blob([txt], { type: 'application/json' })), download: `${p.name.replace(/[^\w\- ]+/g, '')}.json` });
      document.body.append(a); a.click(); a.remove(); this.toast('Arquivo salvo em Downloads.', 'ok');
    } catch { this.copy(txt, 'Regulagem copiada.'); }
  },
  async withProgress(title, fn) {
    const bar = h('i', { style: { width: '0%' } }); const lbl = h('small', { class: 'num' }, '0%');
    const close = this.modal({ title, body: h('div', { class: 'scanbar', style: { margin: 0 } }, h('div', { class: 'meter' }, bar), lbl), actions: [] });
    try { const r = await fn((a, b) => { const p = Math.round(a / b * 100); bar.style.width = p + '%'; lbl.textContent = `${a} de ${b}`; }); close(); return r; }
    catch (e) { close(); this.toast('Falhou: ' + e.message, 'bad'); }
  },
  async dspRead() { const r = await this.withProgress('Lendo regulagens do processador', cb => Dsp.readAll(cb)); if (r) this.toast(r.ok ? `Lidos ${r.ok} de ${r.total} ajustes.` : 'O processador não respondeu às leituras.', r.ok ? 'ok' : 'bad'); this.refresh(); },
  async dspSendAll() {
    if (App.transport instanceof BleTransport && !(await this.confirm('Enviar tudo para o processador?', 'Todas as regulagens da tela serão gravadas no aparelho, substituindo as atuais. Use com volume baixo.'))) return;
    await this.withProgress('Enviando todas as regulagens', cb => Dsp.sendAll(cb)); this.toast('Todas as regulagens foram enviadas.', 'ok'); },

  /* ---------- ASSISTENTE ---------- */
  pAi(body) {
    const s = Dsp.s;
    // 1) diagnóstico
    const tips = Assist.diagnose(s);
    const LV = { p: 'PERIGO', a: 'ATENÇÃO', d: 'DICA', ok: 'TUDO CERTO' };
    const fixable = tips.filter(t => t.fix);
    body.append(
      h('div', { class: 'ai-hero' }, h('h2', {}, 'Assistente inteligente de alinhamento'),
        h('p', {}, 'Revisa sua regulagem, mede o som do carro pelo microfone do tablet e calcula correções e delays. Funciona no próprio tablet: grátis, sem internet e sem limite de uso.')),
      h('div', { class: 'section-title' }, h('h2', {}, '1. Revisão da regulagem'),
        fixable.length ? h('button', { class: 'btn primary', onclick: () => { fixable.forEach(t => t.fix()); Dsp.save(); this.toast(`${fixable.length} correções aplicadas.`, 'ok'); this.refresh(); } }, ic('spark'), `Corrigir tudo (${fixable.length})`) : null),
      h('div', { style: { display: 'flex', flexDirection: 'column', gap: '8px' } }, tips.map(t => h('div', { class: 'tip' }, h('span', { class: 'lv ' + t.lv }, LV[t.lv]), h('div', {}, h('b', {}, t.t), h('small', {}, t.d)),
        t.fix ? h('button', { class: 'btn', onclick: () => { t.fix(); Dsp.save(); this.toast('Corrigido.', 'ok'); this.refresh(); } }, 'Corrigir') : h('span')))));
    // 2) medição
    const tsel = h('select', { class: 'sel', style: { maxWidth: '260px' } }, Object.entries(Assist.TARGETS).map(([k, t]) => h('option', { value: k, selected: k === (this.aiTarget || 'car') }, t.n)));
    tsel.onchange = () => { this.aiTarget = tsel.value; rta.G.paint(); };
    const status = h('small', { style: { color: 'var(--muted)' } }, Assist.rta.running ? 'Microfone ligado.' : 'Microfone desligado.');
    const corrBox = h('div');
    const target = () => Assist.TARGETS[this.aiTarget || 'car'].fn;
    const BF = Assist.BANDS3.filter(f => f <= 20000);
    const rta = this.graph({ height: 300, min: -24, max: 18, legend: [['#3ec6e0', 'Ao vivo'], ['#ffb23f', 'Média medida'], ['#c47bff', 'Curva-alvo']],
      draw: (c, G) => {
        G.curve(c, target(), '#c47bff', 2, false, [6, 5]);
        const live = Assist.rta.bands, avg = Assist.averaged();
        const plot = (arr, color, bars) => {
          if (!arr || !arr.length) return; const nm = Assist.normalize(arr, target());
          if (bars) { const w = G.W / BF.length * .7; BF.forEach((f, i) => { const y = G.y(clamp(nm[i], -24, 18)); c.fillStyle = color; c.fillRect(G.x(f) - w / 2, y, w, G.H - y); }); return; }
          c.beginPath(); BF.forEach((f, i) => { const y = G.y(clamp(nm[i], -24, 18)); i ? c.lineTo(G.x(f), y) : c.moveTo(G.x(f), y); }); c.strokeStyle = color; c.lineWidth = 3; c.stroke();
        };
        plot(live, 'rgba(62,198,224,.28)', true); plot(avg, '#ffb23f');
      } });
    rta.classList.add('rta');
    let loop = null, measuring = 0;
    const tick = () => { if (!Assist.rta.running || !document.body.contains(rta)) { loop = null; return; } Assist.frame(measuring > Date.now()); rta.G.paint(); if (measuring && measuring <= Date.now()) { measuring = 0; status.textContent = `Medição pronta (${Assist.rta.n} leituras somadas).`; showCorr(); } loop = requestAnimationFrame(tick); };
    const showCorr = () => {
      const avg = Assist.averaged(); if (!avg) return;
      const corr = Assist.geqCorrection(avg, target()); Assist.lastCorr = corr;
      corrBox.replaceChildren(h('div', { class: 'panel', style: { marginTop: '12px' } }, h('h3', {}, 'Correção sugerida para o EQ gráfico'),
        h('div', { class: 'geq', style: { pointerEvents: 'none' } }, D.GEQ_F.map((f, i) => h('div', { class: 'bd' }, h('b', { class: 'num' }, (corr[i] > 0 ? '+' : '') + corr[i].toFixed(1)),
          h('div', { style: { width: '10px', height: '120px', borderRadius: '6px', background: '#1b2330', position: 'relative' } }, h('i', { style: { position: 'absolute', left: 0, right: 0, borderRadius: '6px', background: corr[i] >= 0 ? 'var(--ok)' : 'var(--ember)', top: corr[i] >= 0 ? `${50 - corr[i] / 12 * 50}%` : '50%', height: `${Math.abs(corr[i]) / 12 * 50}%` } })),
          h('small', {}, fmtHz(f))))),
        h('div', { style: { display: 'flex', gap: '8px', marginTop: '12px', flexWrap: 'wrap' } },
          h('button', { class: 'btn primary', onclick: () => { s.geq.g = s.geq.g.map((v, i) => clamp(Math.round((v + corr[i]) * 2) / 2, -12, 12)); s.geq.preset = 12; Dsp.send.geq(); this.toast('Correção aplicada no EQ gráfico. Meça de novo para conferir.', 'ok'); } }, ic('check'), 'Aplicar no EQ gráfico'),
          h('small', { style: { color: 'var(--muted)', alignSelf: 'center' } }, 'Corrige 80% do desvio e prefere cortar a reforçar. Abaixo de 35 Hz o microfone do tablet mede pouco.'))));
    };
    body.append(
      h('div', { class: 'section-title' }, h('h2', {}, '2. Medir com o microfone'), tsel),
      h('div', { class: 'panel', style: { marginBottom: '12px' } },
        h('ol', { style: { margin: '0 0 12px', paddingLeft: '20px', color: 'var(--muted)', fontSize: '13.5px' } },
          h('li', {}, 'Coloque o tablet no encosto de cabeça do motorista, microfone para frente.'),
          h('li', {}, 'Ligue o ruído rosa com o volume baixo e suba até ficar forte, sem distorcer.'),
          h('li', {}, 'Toque em "Medir 10 s". Para ficar mais preciso, mude um pouco a posição e meça de novo: as medições somam.')),
        h('div', { style: { display: 'flex', gap: '8px', flexWrap: 'wrap', alignItems: 'center' } },
          this.tog(s.noise.on ? 'RUÍDO ROSA LIGADO' : 'RUÍDO ROSA', s.noise.on, v => { s.noise.on = v; Dsp.send.noise(); }, 'warn'),
          h('button', { class: 'btn', onclick: async () => {
            if (Assist.rta.running) { Assist.stopMic(); status.textContent = 'Microfone desligado.'; return; }
            try { await Assist.startMic(); status.textContent = 'Microfone ligado. Ouvindo…'; if (!loop) loop = requestAnimationFrame(tick); }
            catch (e) { status.textContent = 'Não consegui usar o microfone: ' + (e.message || 'permissão negada') + '. Abra o app pelo arquivo no Chrome e permita o microfone.'; }
          } }, ic('mic'), 'Ligar/desligar microfone'),
          h('button', { class: 'btn primary', onclick: () => { if (!Assist.rta.running) { status.textContent = 'Ligue o microfone primeiro.'; return; } measuring = Date.now() + 10000; status.textContent = 'Medindo por 10 segundos…'; } }, ic('spark'), 'Medir 10 s'),
          h('button', { class: 'btn ghost', onclick: () => { Assist.rta.avg = null; Assist.rta.n = 0; corrBox.replaceChildren(); rta.G.paint(); status.textContent = 'Medições zeradas.'; } }, 'Zerar médias'),
          status)),
      rta, corrBox);
    if (Assist.rta.running && !loop) loop = requestAnimationFrame(tick);
    if (Assist.averaged()) showCorr();
    // 3) alinhamento temporal
    const res = h('div', { style: { color: 'var(--muted)', fontSize: '13px', marginTop: '10px' } });
    const calc = () => { const d = Assist.delaysFromDistances(s.outs.map(o => o.dist || 0)); res.textContent = d ? 'Delays calculados: ' + d.map((v, i) => `${i + 1}) ${v.toFixed(1)} ms`).join(' · ') : 'Preencha as distâncias (em centímetros) do centro de cada falante até o ouvido do motorista.'; return d; };
    body.append(h('div', { class: 'section-title' }, h('h2', {}, '3. Alinhar tempo pela distância'), h('small', {}, 'Use uma fita métrica')),
      h('div', { class: 'panel' },
        h('div', { class: 'dist' }, s.outs.map((o, i) => { const inp = h('input', { type: 'number', min: 0, max: 600, step: 1, value: o.dist || '', placeholder: '0', inputmode: 'numeric', 'aria-label': 'Distância ' + o.name });
          inp.oninput = () => { o.dist = Math.max(0, +inp.value || 0); Dsp.save(); calc(); };
          return h('div', { class: 'ctl', style: { gridTemplateColumns: '1fr 110px' } }, h('label', {}, h('span', { style: { color: D.COLORS[i] } }, '● '), `${i + 1}. ${o.name}`), h('div', { class: 'numbox' }, inp, h('span', {}, 'cm'))); })),
        res,
        h('button', { class: 'btn primary', style: { marginTop: '12px' }, onclick: () => { const d = calc(); if (!d) return; s.outs.forEach((o, i) => { o.delay = d[i]; }); Dsp.send.delay(); this.toast('Delays aplicados. O som deve "sair" do centro do painel.', 'ok'); } }, ic('check'), 'Aplicar delays')));
    calc();
  },
});


})();
</script>
